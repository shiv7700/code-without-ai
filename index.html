<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react.without.ai — practise React by hand</title>
    <!-- This gets shared on X and HN, and at that moment the card outranks the
         page. No image yet; a card with a real title still beats a bare URL. -->
    <meta
      name="description"
      content="301 React challenges with real specs and a real test runner in the browser. Paste is blocked, there are no solutions, and nothing is written for you. Always free."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="You haven’t written a hook in six months." />
    <meta
      property="og:description"
      content="301 React challenges where your agent cannot help you. Paste is off, there are no solutions to find, and the first one needs no account."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Before first paint, or the wrong theme flashes on every reload. -->
    <script>
      const saved = localStorage.getItem('react-practice-theme')
      const dark =
        saved === 'dark' ||
        (!saved && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('dark', dark)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
